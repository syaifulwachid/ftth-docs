site_name: FTTH Design Planner - Dokumentasi & Pusat Bantuan
site_description: Panduan Lengkap dan Dokumentasi Resmi Penggunaan Plugin AutoCAD FTTH Design Planner v3.6.9 (r22)
site_author: Syaiful Wachid
docs_dir: help_docs
site_dir: site

theme:
  name: material
  language: id
  palette:
    # Mode Gelap (Slate-Indigo Default)
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Ganti ke Mode Terang
    # Mode Terang
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Ganti ke Mode Gelap
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables

extra:
  social:
    - icon: fontawesome/brands/whatsapp
      link: https://chat.whatsapp.com/DFjsdcWkD6b8WkG9XRYCsr
      name: Komunitas WhatsApp FTTH Design
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/syaiful-wachid-5373n/
      name: LinkedIn Syaiful Wachid
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/playlist?list=PLLr975-jxOLU
      name: Video Tutorial YouTube

